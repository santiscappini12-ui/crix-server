<style>
:root{
  --bg:#080a0f;--bg2:#0d1018;--bg3:#111520;--bg4:#161b28;--bg5:#1d2335;
  --acc:#5b8def;--acc2:#8b5cf6;--acc3:#ec4899;--green:#22d3a6;
  --yellow:#f59e0b;--red:#ef4444;--orange:#f97316;
  --text:#dde4f0;--text2:#7a86a0;--text3:#3a4255;
  --border:#1e2535;--r:10px;
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);width:100vw;}
button{font-family:var(--font);cursor:pointer;}
input,select,textarea{font-family:var(--font);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3045;border-radius:2px;}
/* ═══ SCREENS ═══ */
.screen{position:fixed;inset:0;display:none;z-index:10;flex-direction:column;}
.screen.active{display:flex;}
/* ═══ AUTH ═══ */
#s-auth{background:radial-gradient(ellipse 80% 80% at 40% 60%,#0f1535 0%,#080a0f 65%);align-items:center;justify-content:center;}
.auth-wrap{width:min(400px,92vw);display:flex;flex-direction:column;gap:20px;}
.auth-brand{text-align:center;display:flex;justify-content:center;align-items:center;}
.auth-sub{text-align:center;color:var(--text2);font-size:13px;margin-top:-12px;}
.auth-card{background:rgba(13,16,24,0.9);border:1px solid var(--border);border-radius:16px;padding:28px;backdrop-filter:blur(20px);}
.auth-card h2{font-family:var(--display);font-size:20px;font-weight:800;margin-bottom:20px;}
.field-grp{margin-bottom:14px;}
.field-lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:5px;display:block;}
.inp{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:8px;font-size:14px;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--acc);}
.inp::placeholder{color:var(--text3);}
.btn{padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-g:hover{border-color:var(--acc);color:var(--text);}
.btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-green{background:rgba(34,211,166,.15);color:var(--green);border:1px solid rgba(34,211,166,.3);}
.err-box{background:#1a0808;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
.link-btn{background:none;border:none;color:var(--acc);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;}
/* ═══ NAV ═══ */
#nav{background:rgba(8,10,15,.95);border-bottom:1px solid var(--border);display:none;align-items:center;padding:0 16px;height:50px;gap:6px;position:fixed;top:0;left:0;right:0;z-index:200;flex-shri[...] }
.nav-logo{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,#5b8def,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:tr[...] }
.nav-tabs{display:flex;gap:1px;flex:1;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);border:none;background:transparent;font-family:var(--font);white-space:nowrap;transitio[...]}
.nav-tab:hover{background:var(--bg3);color:var(--text);}
.nav-tab.active{background:var(--acc);color:#fff;}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
.nav-search{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 12px 6px 30px;border-radius:20px;font-size:12px;width:180px;outline:none;font-family:var(--font);}
.nav-search:focus{border-color:var(--acc);width:220px;transition:width .2s;}
.nav-search-wrap{position:relative;}
.nav-search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;}
.nav-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;border:2px solid var(--border);}
.notif-wrap{position:relative;cursor:pointer;}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--red);position:absolute;top:-1px;right:-1px;display:none;border:1.5px solid var(--bg);}
/* ═══ PAGE SHELL ═══ */
.page{flex:1;overflow-y:auto;padding-top:50px;}
.page-inner{max-width:1200px;margin:0 auto;padding:20px 16px;}
/* ═══ HOME ═══ */
.section-hd{font-family:var(--display);font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.5px;}
.section-hd-accent{width:3px;height:16px;border-radius:2px;background:var(--acc);}
.section-sub{font-size:12px;color:var(--text2);font-weight:400;margin-left:auto;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:32px;}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.game-card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5);}
.game-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;flex-shrink:0;}
.game-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.thumb-icon{position:relative;z-index:1;}
.gt-blue{background:linear-gradient(135deg,#0a1a3a,#0d1520);}
.gt-red{background:linear-gradient(135deg,#2a0a0a,#1a0505);}
.gt-purple{background:linear-gradient(135deg,#1a0a3a,#0d0820);}
.gt-green{background:linear-gradient(135deg,#0a2a1a,#061508);}
.gt-orange{background:linear-gradient(135deg,#2a1a0a,#1a0d05);}
.gt-teal{background:linear-gradient(135deg,#0a2a2a,#051515);}
.game-badge{position:absolute;top:7px;right:7px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;z-index:2;}
.b-hot{background:rgba(249,115,22,.2);color:#f97316;border:1px solid rgba(249,115,22,.35);}
.b-new{background:rgba(34,211,166,.2);color:#22d3a6;border:1px solid rgba(34,211,166,.35);}
.b-top{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid rgba(245,158,11,.35);}
.game-info{padding:10px;}
.game-name{font-weight:700;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-meta{display:flex;gap:10px;font-size:11px;color:var(--text2);}
.game-author{font-size:10px;color:var(--text3);margin-top:2px;}
.game-actions{position:absolute;top:7px;left:7px;display:none;gap:4px;z-index:3;}
.game-card:hover .game-actions{display:flex;}
.game-act-btn{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);color:white;padding:3px 7px;border-radius:5px;font-size:10px;cursor:pointer;font-family:var(--font);}
.game-act-btn:hover{background:var(--acc);}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--text3);font-size:13px;transition:all .2s;margin-bottom:12px;}
.upload-zone:hover{border-color:var(--acc);color:var(--text2);background:rgba(91,141,239,.04);}
/* ... resto de estilos (sin cambios) ... */
@media(max-width:650px){
  #stu-sidebar{width:170px;}#props-panel{display:none;}
  #msg-sidebar{width:210px;}
  .nav-search{display:none;}
}
</style>

<!-- INSERTAMOS UN BLOQUE SEGURO (guards) PARA EVITAR REDECLARACIONES SI SE PEGARA OTRO HTML -->
<script>
/* Evita redeclaraciones si el HTML se concatena dos veces */
if (typeof window.discCurrentFilter === 'undefined') {
  window.discCurrentFilter = 'all';
}

/* swapForm: muestra/oculta formularios de login/registro */
if (typeof window.swapForm === 'undefined') {
  window.swapForm = function(to) {
    try {
      const login = document.getElementById('form-login');
      const reg   = document.getElementById('form-reg');
      if (login) login.style.display = (to === 'login') ? '' : 'none';
      if (reg)   reg.style.display   = (to === 'reg')   ? '' : 'none';
      const err = document.getElementById('auth-err');
      if (err) err.style.display = 'none';
    } catch(e) { /* no crash */ }
  };
}

/* doLogin: implementación mínima que llama a /api/login */
if (typeof window.doLogin === 'undefined') {
  window.doLogin = async function() {
    const username = (document.getElementById('a-u')?.value || '').trim();
    const password = (document.getElementById('a-p')?.value || '');
    const errEl = document.getElementById('auth-err');
    if (!username || !password) {
      if (errEl) { errEl.textContent = 'Completá los campos.'; errEl.style.display = 'block'; }
      return;
    }
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ username, pw: password })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        if (errEl) { errEl.textContent = data.err || 'Error al iniciar sesión'; errEl.style.display = 'block'; }
        return;
      }
      try { localStorage.setItem('crix4_token', data.token || ''); } catch(_) {}
      if (typeof initAfterLogin === 'function') initAfterLogin(data.user, data.token);
      else location.reload();
    } catch (e) {
      if (errEl) { errEl.textContent = e.message || 'No se pudo conectar'; errEl.style.display = 'block'; }
    }
  };
}

/* doRegister: implementación mínima para /api/register */
if (typeof window.doRegister === 'undefined') {
  window.doRegister = async function() {
    const username = (document.getElementById('r-u')?.value || '').trim();
    const p1 = (document.getElementById('r-p')?.value || '');
    const p2 = (document.getElementById('r-p2')?.value || '');
    const errEl = document.getElementById('auth-err');
    if (!username || !p1 || !p2) {
      if (errEl) { errEl.textContent = 'Completá todos los campos.'; errEl.style.display = 'block'; }
      return;
    }
    if (p1 !== p2) {
      if (errEl) { errEl.textContent = 'Las contraseñas no coinciden.'; errEl.style.display = 'block'; }
      return;
    }
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ username, pw: p1 })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        if (errEl) { errEl.textContent = data.err || 'Error al crear la cuenta'; errEl.style.display = 'block'; }
        return;
      }
      try { localStorage.setItem('crix4_token', data.token || ''); } catch(_) {}
      if (typeof initAfterLogin === 'function') initAfterLogin(data.user, data.token);
      else location.reload();
    } catch (e) {
      if (errEl) { errEl.textContent = e.message || 'No se pudo conectar'; errEl.style.display = 'block'; }
    }
  };
}
</script>
