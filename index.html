<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/crix-icon.svg" type="image/svg+xml">
<title>Crix — Plataforma de Juegos</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--bg2:#0d1018;--bg3:#111520;--bg4:#161b28;--bg5:#1d2335;
  --acc:#5b8def;--acc2:#8b5cf6;--acc3:#ec4899;--green:#22d3a6;
  --yellow:#f59e0b;--red:#ef4444;--orange:#f97316;
  --text:#dde4f0;--text2:#7a86a0;--text3:#3a4255;
  --border:#1e2535;--r:10px;
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);width:100vw;}
button{font-family:var(--font);cursor:pointer;}
input,select,textarea{font-family:var(--font);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3045;border-radius:2px;}
/* ═══ SCREENS ═══ */
.screen{position:fixed;inset:0;display:none;z-index:10;flex-direction:column;}
.screen.active{display:flex;}
/* ═══ AUTH ═══ */
#s-auth{background:radial-gradient(ellipse 80% 80% at 40% 60%,#0f1535 0%,#080a0f 65%);align-items:center;justify-content:center;}
.auth-wrap{width:min(400px,92vw);display:flex;flex-direction:column;gap:20px;}
.auth-brand{text-align:center;display:flex;justify-content:center;align-items:center;}
.auth-sub{text-align:center;color:var(--text2);font-size:13px;margin-top:-12px;}
.auth-card{background:rgba(13,16,24,0.9);border:1px solid var(--border);border-radius:16px;padding:28px;backdrop-filter:blur(20px);}
.auth-card h2{font-family:var(--display);font-size:20px;font-weight:800;margin-bottom:20px;}
.field-grp{margin-bottom:14px;}
.field-lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:5px;display:block;}
.inp{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:8px;font-size:14px;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--acc);}
.inp::placeholder{color:var(--text3);}
.btn{padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-g:hover{border-color:var(--acc);color:var(--text);}
.btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-green{background:rgba(34,211,166,.15);color:var(--green);border:1px solid rgba(34,211,166,.3);}
.err-box{background:#1a0808;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
.link-btn{background:none;border:none;color:var(--acc);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;}
/* ═══ NAV ═══ */
#nav{background:rgba(8,10,15,.95);border-bottom:1px solid var(--border);display:none;align-items:center;padding:0 16px;height:50px;gap:6px;position:fixed;top:0;left:0;right:0;z-index:200;flex-shrink:0;backdrop-filter:blur(20px);}
.nav-logo{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,#5b8def,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:8px;flex-shrink:0;}
.nav-tabs{display:flex;gap:1px;flex:1;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);border:none;background:transparent;font-family:var(--font);white-space:nowrap;transition:all .15s;}
.nav-tab:hover{background:var(--bg3);color:var(--text);}
.nav-tab.active{background:var(--acc);color:#fff;}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
.nav-search{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 12px 6px 30px;border-radius:20px;font-size:12px;width:180px;outline:none;font-family:var(--font);}
.nav-search:focus{border-color:var(--acc);width:220px;transition:width .2s;}
.nav-search-wrap{position:relative;}
.nav-search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;}
.nav-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;border:2px solid var(--border);}
.notif-wrap{position:relative;cursor:pointer;}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--red);position:absolute;top:-1px;right:-1px;display:none;border:1.5px solid var(--bg);}
/* ═══ PAGE SHELL ═══ */
.page{flex:1;overflow-y:auto;padding-top:50px;}
.page-inner{max-width:1200px;margin:0 auto;padding:20px 16px;}
/* ═══ HOME ═══ */
.section-hd{font-family:var(--display);font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.5px;}
.section-hd-accent{width:3px;height:16px;border-radius:2px;background:var(--acc);}
.section-sub{font-size:12px;color:var(--text2);font-weight:400;margin-left:auto;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:32px;}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.game-card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5);}
.game-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;flex-shrink:0;}
.game-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.thumb-icon{position:relative;z-index:1;}
.gt-blue{background:linear-gradient(135deg,#0a1a3a,#0d1520);}
.gt-red{background:linear-gradient(135deg,#2a0a0a,#1a0505);}
.gt-purple{background:linear-gradient(135deg,#1a0a3a,#0d0820);}
.gt-green{background:linear-gradient(135deg,#0a2a1a,#061508);}
.gt-orange{background:linear-gradient(135deg,#2a1a0a,#1a0d05);}
.gt-teal{background:linear-gradient(135deg,#0a2a2a,#051515);}
.game-badge{position:absolute;top:7px;right:7px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;z-index:2;}
.b-hot{background:rgba(249,115,22,.2);color:#f97316;border:1px solid rgba(249,115,22,.35);}
.b-new{background:rgba(34,211,166,.2);color:#22d3a6;border:1px solid rgba(34,211,166,.35);}
.b-top{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid rgba(245,158,11,.35);}
.game-info{padding:10px;}
.game-name{font-weight:700;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-meta{display:flex;gap:10px;font-size:11px;color:var(--text2);}
.game-author{font-size:10px;color:var(--text3);margin-top:2px;}
.game-actions{position:absolute;top:7px;left:7px;display:none;gap:4px;z-index:3;}
.game-card:hover .game-actions{display:flex;}
.game-act-btn{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);color:white;padding:3px 7px;border-radius:5px;font-size:10px;cursor:pointer;font-family:var(--font);}
.game-act-btn:hover{background:var(--acc);}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--text3);font-size:13px;transition:all .2s;margin-bottom:12px;}
.upload-zone:hover{border-color:var(--acc);color:var(--text2);background:rgba(91,141,239,.04);}
/* ═══ SEARCH RESULTS ═══ */
#s-search{background:var(--bg);}
.search-hd{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.search-filters{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);overflow-x:auto;}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;}
.filter-btn.active{background:var(--acc);color:#fff;border-color:transparent;}
.search-results{flex:1;overflow-y:auto;padding:16px;}
/* ═══ PROFILE ═══ */
.pf-banner{background:linear-gradient(135deg,#0d1525,#0a0d18);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;}
.pf-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-family:var(--display);}
.pf-name{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-1px;}
.pf-handle{font-size:12px;color:var(--text2);font-family:var(--mono);margin-top:2px;}
.pf-join{font-size:11px;color:var(--text3);margin-top:4px;}
.pf-stats{display:flex;gap:24px;margin-top:12px;}
.pstat-v{font-size:20px;font-weight:800;color:var(--acc);font-family:var(--display);}
.pstat-l{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px;}
.pf-bio{font-size:13px;color:var(--text2);margin-top:8px;}
.pf-btns{margin-top:12px;display:flex;gap:8px;}
.tab-row{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);background:transparent;border:none;font-family:var(--font);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.friends-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.friend-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;}
.friend-card:hover{border-color:var(--acc);}
.friend-av{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;overflow:hidden;}
/* ═══ STUDIO ═══ */
#s-studio{flex-direction:column;}
#hub-menubar{min-height:42px;padding:5px 10px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.hub-brand{font-family:var(--display);font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--text);white-space:nowrap;}
.hub-project-name{max-width:260px;min-width:100px;border:1px solid transparent;background:transparent;color:var(--text);font:700 12px var(--font);padding:5px 8px;border-radius:6px;outline:none;}
.hub-project-name:hover,.hub-project-name:focus{background:var(--bg2);border-color:var(--border);}
.hub-hint{font-size:10px;color:var(--text3);white-space:nowrap;}
.hub-actions{margin-left:auto;display:flex;gap:5px;align-items:center;}
.hub-history-btn{height:27px;min-width:30px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text2);cursor:pointer;font:600 11px var(--font);}
.hub-history-btn:disabled{opacity:.4;cursor:default;}
.hub-snap{width:72px;padding:3px 5px;font-size:10px;}
.hub-explorer-search{margin:7px 7px 3px;width:calc(100% - 14px);font-size:11px;padding:6px 8px;}
#stu-toolbar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.tb-row{display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:2px;padding:3px 6px;}
.tb-row::-webkit-scrollbar{height:2px;}
.tb-row::-webkit-scrollbar-thumb{background:#2a3045;}
.tb-row+.tb-row{border-top:1px solid var(--border);}
.st-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap;flex-shrink:0;height:24px;line-height:1;display:inline-flex;align-items:center;}
.st-btn:hover{border-color:var(--acc);color:var(--text);}
.st-btn.active{background:var(--acc);color:#fff;border-color:transparent;}
.st-btn.red{color:var(--red);}
.st-btn.green{color:var(--green);}
.st-btn.yellow{color:var(--yellow);}
.st-btn.purple{color:#a78bfa;}
.st-sep{width:1px;background:var(--border);margin:0 2px;align-self:stretch;flex-shrink:0;}
#studio-main{flex:1;display:flex;min-height:0;overflow:hidden;}
#stu-sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.panel-hd{padding:7px 12px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;}
.explorer{flex:1;overflow-y:auto;}
.exp-folder{}
.exp-folder-hd{padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--text2);transition:background .1s;user-select:none;}
.exp-folder-hd:hover{background:var(--bg3);}
.exp-arrow{font-size:9px;color:var(--text3);transition:transform .15s;width:10px;}
.exp-folder-hd.open .exp-arrow{transform:rotate(90deg);}
